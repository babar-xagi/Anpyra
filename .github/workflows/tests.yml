name: Tests
on:
  push:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Git reference to validate for a release
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests examples scripts
      - run: ruff format --check src tests examples scripts
      - run: python scripts/check_docs.py
      - run: python -m unittest discover -s tests -v
      - run: anpyra build examples/hello
      - run: anpyra build examples/score
      - run: anpyra check examples/screen_style --dump-dalvik
      - run: anpyra build examples/screen_style
      - run: anpyra verify examples/screen_style/build/dev.anpyra.screenstyle.apk
      - run: anpyra check examples/text_style --dump-dalvik
      - run: anpyra build examples/text_style
      - run: anpyra verify examples/text_style/build/dev.anpyra.textstyle.apk
      - run: anpyra check examples/button_style --dump-dalvik
      - run: anpyra build examples/button_style
      - run: anpyra verify examples/button_style/build/dev.anpyra.buttonstyle.apk
      - run: anpyra check examples/chatbot --dump-dalvik
      - run: anpyra build examples/chatbot
      - run: anpyra verify examples/chatbot/build/dev.anpyra.chatbot.apk
      - run: anpyra verify examples/score/build/dev.anpyra.score.apk
      - run: python -m pip wheel --no-deps . --wheel-dir dist
