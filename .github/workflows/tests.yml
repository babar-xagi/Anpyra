name: Tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests examples
      - run: ruff format --check src tests examples
      - run: python -m unittest discover -s tests -v
      - run: anpyra build examples/hello
      - run: anpyra build examples/score
      - run: anpyra verify examples/score/build/dev.anpyra.score.apk
      - run: python -m pip wheel --no-deps . --wheel-dir dist
