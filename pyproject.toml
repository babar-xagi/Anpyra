[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "anpyra"
version = "0.1.0"
description = "Compile a typed Python subset directly to Android DEX and signed APKs"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["cryptography>=46.0.0"]

[project.optional-dependencies]
dev = ["ruff"]

[project.scripts]
anpyra = "anpyra.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
anpyra = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/fixtures/*.py" = ["F841"]
