[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "anpyra"
version = "0.1.4"
description = "Compile a typed Python subset directly to Android DEX and signed APKs"
readme = "docs/pypi_readme.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["cryptography>=46.0.0", "Pillow>=11.3.0"]
keywords = ["android", "python", "compiler", "dex", "apk", "native"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Build Tools",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/babar-xagi/Anpyra"
Documentation = "https://github.com/babar-xagi/Anpyra/tree/main/docs"
Repository = "https://github.com/babar-xagi/Anpyra"
Issues = "https://github.com/babar-xagi/Anpyra/issues"
Changelog = "https://github.com/babar-xagi/Anpyra/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["ruff"]

[project.scripts]
anpyra = "anpyra.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
anpyra = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/fixtures/*.py" = ["F841"]
